#Training & Experiment params
training:
  n_epochs: 100
  lr: 4.5e-6
  batch_size: 16
  test: False
  gpu_ids: [0]
  checkpoints_dir: 'checkpoints_trans_kitti_360'
  epoch: 'best'
  continue_train: False
  display_freq: 20000
  print_freq: 50
  save_latest_freq: 1000
  verbose: False
  suffix : ''
  seed: 6
  lr_policy: 'identity'
  lr_decay_iters: 10000000
  beta1: 0.5

# model params
model:
  name: 'transformer'
  norm_label: False
  raster_type: 'p2p'
  vq_ckpt_path: checkpoints_kitti_360/0073c213a2bdc0ad0befb7fbbcaff0921032a225b6b6ed2bab798185e328cf3c/best.pth
  transformer_config:
    n_layer: 12
    n_head: 8
    n_embd: 256
    embd_pdrop: 0.0
    resid_pdrop: 0.0
    attn_pdrop: 0.0

  cond_stage_config:
    target: models.modules.misc.coord.CoordStage
    params:
      n_embed: 1024
      down_factor: 16



# dataset params
dataset:
  dataset_A:
    name: 'kitti_360'
    modality: ['depth', 'reflectance']
    fill_in_label: True
    do_gp: False
    img_prop:
      width: 1024
      height: 64
      finesize: -1
